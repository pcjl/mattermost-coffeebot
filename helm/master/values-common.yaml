image:
  repository: "registry.digitalocean.com/infra/mattermost-coffeebot"
  tag: '{{ env "HELM_IMAGE_TAG" }}'
  pullPolicy: IfNotPresent
  pullSecrets: vpnn-infra

node_pool: prod-pool-dedicated

cronjob:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"